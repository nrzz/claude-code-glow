name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Themes and HUD data are up to date
        shell: bash
        run: |
          node scripts/build-themes.mjs
          node scripts/build-hud-data.mjs
          git diff --exit-code -- themes hud/data
